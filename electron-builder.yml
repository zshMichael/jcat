appId: com.jcat.ide
productName: Jcat
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!examples/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,settings.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!.github'
  - '!docs'
  - '!**/*.test.ts'
asarUnpack:
  - resources/**
win:
  executableName: Jcat
  icon: build/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  installerLanguages:
    - zh_CN
    - en_US
    - ko_KR
  artifactName: ${name}-${version}-${arch}-setup.${ext}
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Jcat needs access to your project folders.
    - NSDownloadsFolderUsageDescription: Jcat may save exported images to Downloads.
  notarize: false
  target:
    - dmg
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  maintainer: Jcat
  category: Development
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
