name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    tags-ignore: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-release-version.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
