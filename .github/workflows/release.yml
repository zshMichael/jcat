name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve candidate version
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}"
          else
            echo "unsupported event ${GITHUB_EVENT_NAME} ref ${GITHUB_REF}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved candidate tag ${TAG} (not creating a git tag)"
      - name: Tag matches package, lockfile, and notes
        run: node scripts/check-release-version.mjs --tag "${{ steps.meta.outputs.tag }}"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mac:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac dmg --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: dist/jcat-*.dmg
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build x64, arm64, and multi-arch NSIS
        run: |
          echo "Packaging Windows x64, ARM64, and multi-arch NSIS via electron-builder --win --x64 --arm64 (buildUniversalInstaller=true; not a copy/rename of x64)"
          npx electron-builder --win --x64 --arm64 --publish never
      - name: Verify Windows artifacts are distinct
        shell: bash
        run: npx tsx scripts/check-release-artifacts.mjs --windows
      - name: Silent install, PE arch, and payload smoke
        run: npx tsx scripts/windows-smoke.mjs --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/jcat-*-setup.exe
          if-no-files-found: error

  bundle:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Install 7z for NSIS listing
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Check artifact names, hashes, and payloads
        run: npx tsx scripts/check-release-artifacts.mjs
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum jcat-*.dmg jcat-*-setup.exe | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: |
            dist/jcat-*.dmg
            dist/jcat-*-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refuse to replace an existing Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "publish job requires a v* tag ref"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist
      - name: Recheck frozen assets
        run: npx tsx scripts/check-release-artifacts.mjs
      - name: Confirm SHA256SUMS matches files
        run: |
          set -euo pipefail
          cd dist
          test -f SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: dist/SHA256SUMS.txt
      - name: Create draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s failglob
          gh release create "$GITHUB_REF_NAME" \
            dist/jcat-*.dmg \
            dist/jcat-*-setup.exe \
            dist/SHA256SUMS.txt \
            --draft \
            --title "Jcat ${GITHUB_REF_NAME#v}" \
            --notes-file docs/RELEASE-NOTES-1.1.1.md
      - name: Publish Release after assets exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t assets < <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)
          printf '%s\n' "${assets[@]}"
          test "$(printf '%s\n' "${assets[@]}" | grep -c .)" -ge 5
          gh release edit "$GITHUB_REF_NAME" --draft=false
