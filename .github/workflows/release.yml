name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package, lockfile, and notes
        run: node scripts/check-release-version.mjs --tag "${GITHUB_REF_NAME}"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mac:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac dmg --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: dist/jcat-*.dmg
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build x64, arm64, and multi-arch NSIS
        run: |
          echo "Packaging Windows x64, ARM64, and multi-arch NSIS via electron-builder --win --x64 --arm64 (buildUniversalInstaller=true; not a copy/rename of x64)"
          npx electron-builder --win --x64 --arm64 --publish never
      - name: Verify Windows artifacts are distinct
        shell: bash
        run: npx tsx scripts/check-release-artifacts.mjs --windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/jcat-*-setup.exe
          if-no-files-found: error

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refuse to replace an existing v1.1.1 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Install 7z for NSIS listing
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Check artifact names, hashes, and payloads
        run: npx tsx scripts/check-release-artifacts.mjs
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum jcat-*.dmg jcat-*-setup.exe | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: dist/SHA256SUMS.txt
      - name: Create draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s failglob
          gh release create "$GITHUB_REF_NAME" \
            dist/jcat-*.dmg \
            dist/jcat-*-setup.exe \
            dist/SHA256SUMS.txt \
            --draft \
            --title "Jcat ${GITHUB_REF_NAME#v}" \
            --notes-file docs/RELEASE-NOTES-1.1.1.md
      - name: Publish Release after assets exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t assets < <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)
          printf '%s\n' "${assets[@]}"
          test "$(printf '%s\n' "${assets[@]}" | grep -c .)" -ge 5
          gh release edit "$GITHUB_REF_NAME" --draft=false
