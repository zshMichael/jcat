name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          test "$TAG" = "$PKG"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mac:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac dmg --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: dist/jcat-*.dmg

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --x64 --arm64 --publish never
      - name: Default Windows x64 alias
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          if [ -f "dist/jcat-$VER-x64-setup.exe" ] && [ ! -f "dist/jcat-$VER-setup.exe" ]; then
            cp "dist/jcat-$VER-x64-setup.exe" "dist/jcat-$VER-setup.exe"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/jcat-*-setup.exe

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check artifact names
        run: node scripts/check-release-artifacts.mjs
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum jcat-*.dmg jcat-*-setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/jcat-*.dmg \
            dist/jcat-*-setup.exe \
            dist/SHA256SUMS.txt \
            --title "Jcat ${GITHUB_REF_NAME#v}" \
            --notes-file docs/RELEASE-NOTES-1.1.1.md
